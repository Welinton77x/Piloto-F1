name: Gerar voz Liam (rua alagada)
on:
  push:
    paths: ["rua-alagada/VOZ.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: voz-rua
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -y >/dev/null && sudo apt-get install -y ffmpeg >/dev/null
      - name: Gerar narração (uma vez; pula se já existe)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -f rua-alagada/app/public/vo/s11.mp3 ]; then echo "voz já existe, nada a fazer"; exit 0; fi
          python rua-alagada/app/scripts/tts_elevenlabs.py
      - name: Guardar no branch
        run: |
          git config user.name "claude-bot"; git config user.email "bot@users.noreply.github.com"
          git add rua-alagada/app/public/vo rua-alagada/app/src/data/timing.json
          git commit -m "Voz Liam gerada (rua alagada)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
