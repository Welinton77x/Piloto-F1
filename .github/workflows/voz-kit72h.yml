name: Gerar voz Liam (kit72h)
on:
  push:
    paths: ["kit72h/VOZ.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: voz-kit72h
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -y >/dev/null && sudo apt-get install -y ffmpeg >/dev/null
      - name: Gerar narração (uma vez; pula se já existe)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          ONLY=""; [ -f kit72h/VOZ_ONLY.txt ] && ONLY=$(cat kit72h/VOZ_ONLY.txt)
          if [ -z "$ONLY" ] && [ -f kit72h/app/public/vo/s8.mp3 ]; then echo "voz já existe, nada a fazer"; exit 0; fi
          TTS_ONLY="$ONLY" python kit72h/app/scripts/tts_elevenlabs.py
          rm -f kit72h/VOZ_ONLY.txt
      - name: Guardar no branch
        run: |
          git config user.name "claude-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A kit72h/
          git commit -m "Voz Liam gerada (kit72h)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
