name: Transcrever referência (nordeste)
on:
  push:
    paths: ["nordeste/stt/PEDIDO.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: stt-nordeste
jobs:
  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transcrever
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python nordeste/stt/transcrever.py
      - name: Guardar no branch
        run: |
          git config user.name "claude-bot"; git config user.email "bot@users.noreply.github.com"
          git add nordeste/stt/words.json
          git commit -m "Transcrição da referência (nordeste)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
