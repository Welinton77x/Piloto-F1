name: Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ferramentas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev libcups2 libxkbcommon-dev libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2t64

      - name: Montar o projeto
        run: |
          unzip -q por-que-piloto-f1.zip
          npx --yes create-video@latest --yes --blank --no-tailwind app
          cd app
          rm -rf src public
          cp -r ../por-que-piloto-f1/project/src ../por-que-piloto-f1/project/public ../por-que-piloto-f1/project/scripts ../por-que-piloto-f1/project/tsconfig.json ../por-que-piloto-f1/project/remotion.config.ts .
          npx remotion add @remotion/three @remotion/google-fonts
          npm i three @react-three/fiber @react-three/drei
          npm i -D @types/three

      - name: Gerar a voz
        working-directory: app
        run: |
          pip install edge-tts
          python scripts/tts_edge.py

      - name: Conferir tipos
        working-directory: app
        run: npx tsc --noEmit

      - name: Navegador do Remotion
        working-directory: app
        run: npx remotion browser ensure

      - name: Imagens de teste
        working-directory: app
        continue-on-error: true
        run: |
