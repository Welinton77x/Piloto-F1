name: Stills
on:
  workflow_dispatch:
  push:
    paths: ["vid/**"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: bash vid/ci/stills.sh 2>&1 | tee run.log
      - if: always()
        run: |
          mkdir -p stills
          rm -f stills/*
          cp app/out/*.png stills/ 2>/dev/null || true
          tail -n 60 run.log > stills/log.txt
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add stills
          git commit -m "Imagens de teste" || true
          git pull --rebase -q || true
          git push || true
